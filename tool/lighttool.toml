[tool]
id = "io.github.jabberbox.bubblelight"
label = "Bubble Light"
versionCode = 5
versionName = "1.1.3"
# The camera is used only to scan the server's setup QR code.
permissions = ["android.permission.INTERNET", "android.permission.CAMERA"]
# Self-hosted BlueBubbles servers are often plain http on the home network.
capabilities = ["cleartext-http"]
serverPackage = "com.lightos"
